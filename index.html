    <!-- Instant Branded Startup Splash Styles (Renders at 0ms before JS bundle) -->
    <style>
      #suzika-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 22% 18%, rgba(255, 53, 187, 0.16), transparent 46%),
          radial-gradient(circle at 78% 82%, rgba(0, 210, 255, 0.14), transparent 46%),
          #080a12;
        transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s ease;
        font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      #suzika-boot-splash.suzika-splash-hide {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.02);
        pointer-events: none;
      }
      .suzika-splash-badge-wrap {
        position: relative;
        width: 108px;
        height: 108px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .suzika-splash-ring {
        position: absolute;
        inset: -8px;
        border-radius: 30px;
        padding: 2.5px;
        background: conic-gradient(from 0deg, #ff35bb, #8b4dff, #00d2ff, #ff35bb);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: suzika-spin-ring 2.6s linear infinite;
      }
      .suzika-splash-glow {
        position: absolute;
        inset: -18px;
        border-radius: 36px;
        background: linear-gradient(135deg, rgba(255, 53, 187, 0.42), rgba(139, 77, 255, 0.35), rgba(0, 210, 255, 0.42));
        filter: blur(22px);
        animation: suzika-pulse-glow 2s ease-in-out infinite;
      }
      .suzika-splash-logo {
        position: relative;
        width: 92px;
        height: 92px;
        border-radius: 24px;
        overflow: hidden;
        background: #0d101b;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
        animation: suzika-logo-breathe 2.2s ease-in-out infinite;
      }
      .suzika-splash-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .suzika-splash-title {
        margin-top: 24px;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -0.02em;
        color: #ffffff;
        line-height: 1.1;
      }
      .suzika-splash-title span {
        background: linear-gradient(90deg, #ff35bb, #b77bff, #00d2ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .suzika-splash-sub {
        margin-top: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9da4b8;
      }
      .suzika-splash-bar {
        margin-top: 22px;
        width: 156px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        position: relative;
      }
      .suzika-splash-bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: -45%;
        width: 55%;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff35bb, #8b4dff, #00d2ff);
        animation: suzika-load-slide 1.25s ease-in-out infinite;
      }
      @keyframes suzika-spin-ring {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes suzika-pulse-glow {
        0%, 100% { opacity: 0.55; transform: scale(0.95); }
        50% { opacity: 0.95; transform: scale(1.06); }
      }
      @keyframes suzika-logo-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes suzika-load-slide {
        0% { left: -55%; }
        100% { left: 110%; }
      }
    </style>

    <script>
      (function() {
        try {
          var PURGE_FLAG = 'zuzika_purged_old_dummy_v4';
          if (localStorage.getItem(PURGE_FLAG) !== 'true') {
            ['zuzika_photos_v1', 'zuzika_photos_v2', 'zuzika_photos_v3', 'zuzika_videos_v1', 'zuzika_videos_v2', 'zuzika_videos_v3'].forEach(function(k) {
              try { localStorage.removeItem(k); } catch(e) {}
            });
            if (window.indexedDB) {
              ['zuzika_persistent_db_v2', 'zuzika_persistent_db_v1', 'zuzika_persistent_db'].forEach(function(name) {
                try { window.indexedDB.deleteDatabase(name); } catch(e) {}
              });
            }
            localStorage.setItem(PURGE_FLAG, 'true');
          }
        } catch(e) {}
      })();
    </script>

    <script>
      // Safety auto-dismiss if JS takes unusually long on slow networks
      window.__dismissSuzikaSplash = function() {
        var el = document.getElementById('suzika-boot-splash');
        if (!el || el.dataset.hiding === 'true') return;
        el.dataset.hiding = 'true';
        el.classList.add('suzika-splash-hide');
        setTimeout(function() {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 450);
      };
      setTimeout(function() {
        if (window.__dismissSuzikaSplash) window.__dismissSuzikaSplash();
      }, 6000);
    </script>
